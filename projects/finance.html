<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Dashboard</title><link rel="stylesheet" href="demo.css"></head><body style="--a:#ff6b4a;--b:#ffaf8e"><div class="top"><a href="../index.html#projects">&larr; Back to portfolio</a><span>Demo project</span></div><div class="hero" style="background:linear-gradient(rgba(60,10,20,.25),rgba(60,10,20,.35)),url(finance/hero.jpg) center/cover"><h1>My Budget</h1><p>Track spending at a glance.</p></div>
<div class="wrap"><div class="grid"><div class="card"><p>Total spent</p><h2 id="t"></h2></div><div class="card"><p>Budget left (of $1000)</p><h2 id="l"></h2></div></div>
<form class="card" id="f" style="margin-top:18px"><div class="row"><input id="n" placeholder="What for?" required><input id="a" type="number" min="1" placeholder="Amount $" required></div><button>Add expense</button></form>
<div class="card" id="b" style="margin-top:18px;display:flex;align-items:flex-end;gap:8px;height:200px"></div></div>
<script>let x=[["Food",220],["Rent",450],["Travel",90],["Fun",60]];function r(){t.textContent="$"+x.reduce((s,i)=>s+i[1],0);l.textContent="$"+(1000-x.reduce((s,i)=>s+i[1],0));let m=Math.max(...x.map(i=>i[1]));b.innerHTML=x.map(i=>`<div style="flex:1;text-align:center;font-size:.75rem"><div style="background:#ff6b4a;border-radius:6px 6px 0 0;height:${i[1]/m*140}px"></div>${i[0]}<br>$${i[1]}</div>`).join("")}
f.onsubmit=e=>{e.preventDefault();x.push([n.value,+a.value]);f.reset();r()};r()</script></body></html>
