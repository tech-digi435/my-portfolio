<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="stylesheet" href="demo.css"></head><body style="--a:#ff6b4a;--b:#0f172a"><div class="top"><a href="../index.html#projects">&larr; Back to portfolio</a><span>Demo project</span></div><div class="hero" style="background:linear-gradient(rgba(15,23,42,.25),rgba(15,23,42,.45)),url(weather/sky.jpg) center/cover"><h1>Weather</h1><form id="f" class="row" style="max-width:420px;margin:15px auto 0"><input id="c" value="Islamabad"><button style="background:#0f172a">Search</button></form></div>
<div class="wrap"><div class="card" style="text-align:center"><div id="i" style="font-size:4rem"></div><h2 id="n">Loading...</h2><h1 id="t"></h1><p id="w"></p></div></div>
<script>const E=c=>c==0?"☀️":c<4?"⛅":c<50?"🌫️":c<70?"🌧️":c<80?"❄️":c<90?"🌦️":"⛈️";
async function go(){try{n.textContent="Loading...";let g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(c.value))).json();if(!g.results)throw 0;let p=g.results[0],d=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code,wind_speed_10m`)).json()).current;i.textContent=E(d.weather_code);n.textContent=p.name+", "+p.country;t.textContent=d.temperature_2m+"°C";w.textContent="Wind "+d.wind_speed_10m+" km/h"}catch(e){n.textContent="City not found or no internet";i.textContent=t.textContent=w.textContent=""}}
f.onsubmit=e=>{e.preventDefault();go()};go()</script></body></html>
