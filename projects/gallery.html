<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photographer Portfolio</title><link rel="stylesheet" href="demo.css">
<style>.ph{margin:0;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:#0f172a}.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.ph:hover img{transform:scale(1.07)}.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;color:#fff;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.7))}.lb{flex-direction:column;gap:12px;padding:16px;font-size:1.1rem}.lb img{max-width:100%;max-height:80vh;border-radius:10px}</style></head>
<body style="--a:#0f172a;--b:#3d4c6c"><div class="top"><a href="../index.html#projects">&larr; Back to portfolio</a><span>Demo project</span></div>
<div class="hero"><h1>Lens &amp; Light</h1><p>Selected work. Click any photo to enlarge.</p></div>
<div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><figure class="ph" onclick="show('mountains','Mountains')"><img src="gallery/mountains.jpg" alt="Mountains" loading="lazy"><figcaption>Mountains</figcaption></figure><figure class="ph" onclick="show('street','Street')"><img src="gallery/street.jpg" alt="Street" loading="lazy"><figcaption>Street</figcaption></figure><figure class="ph" onclick="show('portrait','Portrait')"><img src="gallery/portrait.jpg" alt="Portrait" loading="lazy"><figcaption>Portrait</figcaption></figure><figure class="ph" onclick="show('ocean','Ocean')"><img src="gallery/ocean.jpg" alt="Ocean" loading="lazy"><figcaption>Ocean</figcaption></figure><figure class="ph" onclick="show('forest','Forest')"><img src="gallery/forest.jpg" alt="Forest" loading="lazy"><figcaption>Forest</figcaption></figure><figure class="ph" onclick="show('city-night','City Night')"><img src="gallery/city-night.jpg" alt="City Night" loading="lazy"><figcaption>City Night</figcaption></figure><figure class="ph" onclick="show('desert','Desert')"><img src="gallery/desert.jpg" alt="Desert" loading="lazy"><figcaption>Desert</figcaption></figure><figure class="ph" onclick="show('wedding','Wedding')"><img src="gallery/wedding.jpg" alt="Wedding" loading="lazy"><figcaption>Wedding</figcaption></figure></div></div>
<div class="lb" id="l" onclick="this.style.display='none'"><img id="li" alt=""><span id="lc"></span></div>
<script>function show(n,t){li.src="gallery/"+n+".jpg";lc.textContent=t+" (click to close)";l.style.display="flex"}</script></body></html>
